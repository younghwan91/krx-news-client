[project]
name = "krx-news-client"
version = "0.5.1"
description = "한국 주식시장 뉴스·공시 수집 클라이언트 라이브러리 (토스/DART)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
keywords = [
    "dart", "opendart", "disclosure", "공시", "korea", "krx", "kospi", "kosdaq",
    "stock", "news", "뉴스", "tossinvest", "finance", "quant", "backtest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Korean",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/younghwan91/krx-news-client"
Documentation = "https://github.com/younghwan91/krx-news-client/blob/main/docs/guide.md"
Repository = "https://github.com/younghwan91/krx-news-client"
Issues = "https://github.com/younghwan91/krx-news-client/issues"
Changelog = "https://github.com/younghwan91/krx-news-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krx_news_client"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
